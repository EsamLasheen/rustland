[package]
name = "monarch-next"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "monarch_platform"
path = "src/platform.rs"

[[bin]]
name = "monarch-next"
path = "src/main.rs"

[dependencies]
monarch-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-numerics = "0.3"
windows-core = "0.62"
windows = { version = "0.62", features = [
 "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
 "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry",
 "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Shutdown",
 "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
 "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
 "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_Security", "Win32_Security_Cryptography",
 "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
 "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Variant",
 "Win32_System_DataExchange", "Win32_System_Memory",
 "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Imaging", "Win32_Graphics_Dxgi_Common", "Win32_NetworkManagement_WiFi",
 "Foundation", "Foundation_Collections", "Devices_Radios", "Media_Control",
 "Win32_System_Wmi", "Win32_System_Ole", "Win32_Devices_Display", "Win32_Networking_WinHttp",
 "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus"
] }

[build-dependencies]
embed-resource = "3"

